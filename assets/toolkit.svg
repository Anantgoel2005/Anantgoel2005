<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img" aria-labelledby="title desc">
  <style>
    .pill { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: .2s; } .p3 { animation-delay: .4s; } .p4 { animation-delay: .6s; }
    .p5 { animation-delay: .8s; } .p6 { animation-delay: 1s; } .p7 { animation-delay: 1.2s; }
    .p8 { animation-delay: 1.4s; } .p9 { animation-delay: 1.6s; } .p10 { animation-delay: 1.8s; }
    .glow { animation: sweep 7s linear infinite; }
    @keyframes breathe { 50% { filter: brightness(1.18); opacity: .9; } }
    @keyframes sweep { from { transform: translateX(-220px) skewX(-20deg); } to { transform: translateX(1420px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <title id="title">Anant's engineering toolkit</title>
  <desc id="desc">Colored toolkit cards for Python, TypeScript, FastAPI, Next.js, PostgreSQL, Redis, Docker, PyTorch, OpenCV, and YOLO.</desc>
  <rect width="1200" height="148" rx="18" fill="#0f172a"/>
  <text x="42" y="42" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">CURRENT TOOLKIT</text>
  <text x="42" y="67" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">Tools I use to build and ship end-to-end systems</text>
  <g transform="translate(42 92)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    <g class="pill"><rect width="100" height="30" rx="15" fill="#3776ab"/><text x="50" y="20" text-anchor="middle" fill="#fff">Python</text></g>
    <g class="pill p2" transform="translate(112 0)"><rect width="116" height="30" rx="15" fill="#3178c6"/><text x="58" y="20" text-anchor="middle" fill="#fff">TypeScript</text></g>
    <g class="pill p3" transform="translate(240 0)"><rect width="98" height="30" rx="15" fill="#009688"/><text x="49" y="20" text-anchor="middle" fill="#fff">FastAPI</text></g>
    <g class="pill p4" transform="translate(350 0)"><rect width="92" height="30" rx="15" fill="#111827" stroke="#94a3b8"/><text x="46" y="20" text-anchor="middle" fill="#fff">Next.js</text></g>
    <g class="pill p5" transform="translate(454 0)"><rect width="118" height="30" rx="15" fill="#336791"/><text x="59" y="20" text-anchor="middle" fill="#fff">PostgreSQL</text></g>
    <g class="pill p6" transform="translate(584 0)"><rect width="84" height="30" rx="15" fill="#dc382d"/><text x="42" y="20" text-anchor="middle" fill="#fff">Redis</text></g>
    <g class="pill p7" transform="translate(680 0)"><rect width="94" height="30" rx="15" fill="#2496ed"/><text x="47" y="20" text-anchor="middle" fill="#fff">Docker</text></g>
    <g class="pill p8" transform="translate(786 0)"><rect width="94" height="30" rx="15" fill="#ee4c2c"/><text x="47" y="20" text-anchor="middle" fill="#fff">PyTorch</text></g>
    <g class="pill p9" transform="translate(892 0)"><rect width="94" height="30" rx="15" fill="#5c3ee8"/><text x="47" y="20" text-anchor="middle" fill="#fff">OpenCV</text></g>
    <g class="pill p10" transform="translate(998 0)"><rect width="80" height="30" rx="15" fill="#22c55e"/><text x="40" y="20" text-anchor="middle" fill="#062814">YOLO</text></g>
  </g>
  <rect class="glow" x="0" y="0" width="120" height="148" fill="#ffffff" opacity="0.025"/>
</svg>
